name: Build Week 4 Automotive Risk and Opportunity Assessment

on:
  push:
    branches: [main]
    paths:
      - 'task4-risk-opportunity-assessment/**'
      - '.github/workflows/task4-risk-opportunity.yml'
  workflow_dispatch:

concurrency:
  group: task4-risk-opportunity
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r task4-risk-opportunity-assessment/requirements.txt
      - name: Generate report, charts and registers
        working-directory: task4-risk-opportunity-assessment
        run: python risk_opportunity_assessment.py
      - name: Upload Task 4 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: automotive-risk-opportunity-assessment-week4
          path: |
            task4-risk-opportunity-assessment/Automotive_Risk_and_Opportunity_Assessment_Week4_Report.docx
            task4-risk-opportunity-assessment/Submission_Description.docx
            task4-risk-opportunity-assessment/submission_description.txt
            task4-risk-opportunity-assessment/visualizations/
            task4-risk-opportunity-assessment/outputs/
            task4-risk-opportunity-assessment/README.md
            task4-risk-opportunity-assessment/requirements.txt
            task4-risk-opportunity-assessment/risk_opportunity_assessment.py
          if-no-files-found: error
