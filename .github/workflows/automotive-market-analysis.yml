name: Build Automotive Stock Market Analysis Report

on:
  push:
    branches: [main]
    paths:
      - 'automotive_market_analysis.py'
      - 'README.md'
      - 'requirements.txt'
      - 'submission_description.txt'
      - '.github/workflows/automotive-market-analysis.yml'
  workflow_dispatch:

concurrency:
  group: automotive-market-analysis-standalone
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download market data and generate report
        run: python automotive_market_analysis.py
      - name: Upload the report and generated results
        uses: actions/upload-artifact@v4
        with:
          name: automotive-stock-market-analysis
          path: |
            Automotive_Market_Overview_and_Trend_Analysis_Report.docx
            Submission_Description.docx
            visualizations/
            outputs/
            automotive_market_analysis.py
            README.md
            requirements.txt
            submission_description.txt
          if-no-files-found: error
      - name: Publish generated deliverables to the latest main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/automotive-generated/visualizations /tmp/automotive-generated/outputs
          cp Automotive_Market_Overview_and_Trend_Analysis_Report.docx Submission_Description.docx /tmp/automotive-generated/
          cp -a visualizations/. /tmp/automotive-generated/visualizations/
          cp -a outputs/. /tmp/automotive-generated/outputs/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/automotive-generated/Automotive_Market_Overview_and_Trend_Analysis_Report.docx .
          cp /tmp/automotive-generated/Submission_Description.docx .
          mkdir -p visualizations outputs
          cp -a /tmp/automotive-generated/visualizations/. visualizations/
          cp -a /tmp/automotive-generated/outputs/. outputs/
          git add Automotive_Market_Overview_and_Trend_Analysis_Report.docx Submission_Description.docx visualizations outputs
          if git diff --cached --quiet; then
            echo "Generated files already match main."
          else
            git commit -m "Publish automotive market analysis report and charts"
            git push origin HEAD:main
          fi
